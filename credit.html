<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINT | Portfolio Credit Overview</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --mint-primary-purple: #5c3bcf;
            --mint-light-purple: #e0e7ff;
            --mint-bg: #f8f9fc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--mint-bg);
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Glassmorphism for the purple section */
        .glass-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Sleek Gauge Animation */
        @keyframes fillSleekGauge {
            from {
                stroke-dashoffset: 282.7;
            }

            to {
                stroke-dashoffset: 190;
            }

            /* Animates to approx 33% filled */
        }

        .gauge-foreground {
            stroke-dasharray: 282.7;
            stroke-dashoffset: 282.7;
            animation: fillSleekGauge 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            animation-delay: 0.2s;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col relative">

    <!-- Navbar -->
    <div id="main-header-placeholder"></div>
    <script src="js/global-navbar.js"></script>

    <!-- TOP SECTION: Light Background (Takes up top ~60% of viewport) -->
    <div class="flex-none h-[58%] w-full max-w-3xl mx-auto px-6 pt-8 pb-4 flex flex-col items-center relative z-0">

        <!-- Header -->
        <header class="w-full flex justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <div
                    class="w-10 h-10 rounded-full bg-gray-200 border-2 border-white shadow-sm flex items-center justify-center shrink-0 overflow-hidden">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" class="w-5 h-5 text-gray-500"
                        stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
                    </svg>
                </div>
                <div class="flex flex-col">
                    <h1 class="text-xl font-bold tracking-tight text-gray-900 leading-tight">Portfolio Credit</h1>
                    <span
                        class="text-[10px] font-semibold text-[var(--mint-primary-purple)] uppercase tracking-widest">MINT
                        USER</span>
                </div>
            </div>

            <button class="w-10 h-10 flex items-center justify-end text-gray-400 hover:text-gray-900 transition-colors">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </button>
        </header>

        <!-- Segmented Control (Tabs) -->
        <div class="bg-white rounded-full p-1.5 shadow-sm mb-6 flex gap-1 w-full max-w-sm">
            <button
                class="flex-1 py-2 rounded-full bg-[var(--mint-primary-purple)] text-white text-xs font-semibold shadow-md transition-all">
                Overview
            </button>
            <button
                class="flex-1 py-2 rounded-full bg-transparent text-gray-400 hover:text-gray-900 text-xs font-medium transition-all">
                Active
            </button>
            <button
                class="flex-1 py-2 rounded-full bg-transparent text-gray-400 hover:text-gray-900 text-xs font-medium transition-all">
                Statements
            </button>
        </div>

        <!-- Date Selector -->
        <div class="flex justify-center mb-6">
            <button
                class="flex items-center gap-1.5 text-gray-800 text-sm font-semibold hover:text-[var(--mint-primary-purple)] transition-colors">
                This month
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
        </div>

        <!-- Sleek Gauge Area -->
        <div class="relative w-full max-w-[280px] aspect-[2/1] mb-8">
            <!-- Floating Arc Chart -->
            <svg viewBox="0 0 200 110" class="w-full h-full drop-shadow-sm overflow-visible">
                <!-- Background Track -->
                <path d="M 10 100 A 90 90 0 0 1 190 100" fill="none" stroke="var(--mint-light-purple)" stroke-width="16"
                    stroke-linecap="round" />
                <!-- Foreground MINT Track -->
                <path class="gauge-foreground" d="M 10 100 A 90 90 0 0 1 190 100" fill="none"
                    stroke="var(--mint-primary-purple)" stroke-width="16" stroke-linecap="round" />
            </svg>

            <!-- Center Text -->
            <div class="absolute bottom-0 left-0 w-full flex flex-col items-center justify-end text-center">
                <span class="text-[10px] text-gray-500 font-semibold uppercase tracking-wider mb-0.5">Available
                    Credit</span>
                <h2 class="text-4xl font-bold tracking-tight text-gray-900">R 450k</h2>
            </div>
        </div>

        <!-- Sleek Metrics Row -->
        <div class="flex justify-between items-center w-full max-w-sm px-6">

            <div class="flex flex-col items-start gap-1">
                <span class="text-sm font-bold text-gray-900">R 150k</span>
                <div class="flex items-center gap-1.5">
                    <div class="w-3 h-1 bg-[var(--mint-primary-purple)] rounded-full"></div>
                    <span class="text-[10px] text-gray-400 font-medium">Utilized</span>
                </div>
            </div>

            <div class="flex flex-col items-center gap-1">
                <span class="text-sm font-bold text-gray-900">11.5 <span
                        class="text-xs font-medium text-gray-400">%</span></span>
                <div class="flex items-center gap-1.5">
                    <div class="w-3 h-1 bg-gray-200 rounded-full opacity-0"></div> <!-- Spacer for alignment -->
                    <span
                        class="text-[10px] text-gray-400 font-medium border-t border-gray-200 pt-1 w-full text-center">Base
                        APR</span>
                </div>
            </div>

            <div class="flex flex-col items-end gap-1">
                <span class="text-sm font-bold text-gray-900">R 600k</span>
                <div class="flex items-center gap-1.5">
                    <span class="text-[10px] text-gray-400 font-medium">Facility Limit</span>
                    <div class="w-3 h-1 bg-[var(--mint-light-purple)] rounded-full"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- BOTTOM SECTION: Deep MINT Purple (Takes up bottom ~42% of viewport) -->
    <div
        class="flex-1 w-full bg-[var(--mint-primary-purple)] rounded-t-[2.5rem] shadow-[0_-15px_40px_rgba(92,59,207,0.25)] relative z-10 flex flex-col items-center pt-8 px-6 pb-6 overflow-hidden">

        <div class="w-full max-w-3xl flex flex-col h-full">
            <!-- Section Header -->
            <div class="flex justify-between items-center mb-6 pl-2 pr-1">
                <h3 class="text-white text-sm font-medium tracking-wide opacity-90">Recent activities</h3>
                <button class="text-white/60 hover:text-white text-xs font-medium transition-colors tracking-wide">See
                    all</button>
            </div>

            <!-- Glass Items Container (Fits exactly 2 items in standard viewport) -->
            <div class="flex flex-col gap-3 flex-1 overflow-hidden">

                <!-- Activity Item 1 -->
                <div class="glass-card rounded-[1.5rem] p-4 flex items-center justify-between cursor-pointer w-full">
                    <div class="flex items-center gap-4">
                        <!-- Custom Icon -->
                        <div
                            class="w-12 h-12 rounded-[1rem] bg-white/20 border border-white/10 flex items-center justify-center shrink-0">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 2v6h6"></path>
                                <path d="M21 12A9 9 0 0 0 6 5.3L3 8"></path>
                                <path d="M21 22v-6h-6"></path>
                                <path d="M3 12a9 9 0 0 0 15 6.7l3-2.7"></path>
                            </svg>
                        </div>
                        <div class="flex flex-col gap-0.5">
                            <h4 class="text-white font-semibold text-sm tracking-wide">Credit Drawdown</h4>
                            <div class="flex items-center gap-1.5">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                                    stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <polyline points="15 10 20 15 15 20"></polyline>
                                    <path d="M4 4v7a4 4 0 0 0 4 4h12"></path>
                                </svg>
                                <p class="text-xs text-white/60 font-medium">12 Jul 2026</p>
                            </div>
                        </div>
                    </div>
                    <div class="text-right flex flex-col gap-0.5">
                        <span class="block text-white font-bold text-sm tracking-tight">-R 25k</span>
                        <span class="text-[10px] text-white/50 font-medium">12 min ago</span>
                    </div>
                </div>

                <!-- Activity Item 2 -->
                <div class="glass-card rounded-[1.5rem] p-4 flex items-center justify-between cursor-pointer w-full">
                    <div class="flex items-center gap-4">
                        <!-- Custom Icon -->
                        <div
                            class="w-12 h-12 rounded-[1rem] bg-emerald-400/20 border border-emerald-400/20 flex items-center justify-center shrink-0">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#34d399"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </div>
                        <div class="flex flex-col gap-0.5">
                            <h4 class="text-white font-semibold text-sm tracking-wide">Capital Repayment</h4>
                            <div class="flex items-center gap-1.5">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
                                    stroke="rgba(52,211,153,0.8)" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <polyline points="9 14 4 9 9 4"></polyline>
                                    <path d="M20 20v-7a4 4 0 0 0-4-4H4"></path>
                                </svg>
                                <p class="text-xs text-emerald-400/80 font-medium">28 Jun 2026</p>
                            </div>
                        </div>
                    </div>
                    <div class="text-right flex flex-col gap-0.5">
                        <span class="block text-emerald-400 font-bold text-sm tracking-tight">+R 15k</span>
                        <span class="text-[10px] text-white/50 font-medium">Cleared</span>
                    </div>
                </div>

            </div>

        </div>
    </div>

</body>

</html>
